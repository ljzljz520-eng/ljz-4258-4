services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dairy
      POSTGRES_USER: dairy
      POSTGRES_PASSWORD: dairy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dairy -d dairy"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dairy
      SPRING_DATASOURCE_USERNAME: dairy
      SPRING_DATASOURCE_PASSWORD: dairy
      APP_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
